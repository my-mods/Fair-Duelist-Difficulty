[Mod]
Id = oOCamilleOo_FairDuelist
Name = Fair Duelist - Customizable Difficulty
Author = oOCamilleOo
Version = 1.1.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Runtime difficulty overrides
Group = General
Description = The packaged Fair Duelist preset remains installed when this is Off. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.referenceDifficulty]
Id = referenceDifficulty
Label = Reference difficulty
Group = Balance
Description = Calculation baseline for every multiplier; select Fair Duelist for RPG and Action Difficulty in the game. Apply, then load a save.
Type = picker
PresetValues = 0|1|2|3
PresetLabels = Story|Fair|Challenging|Duelist
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = referenceDifficulty

[Setting.enemyHealthPercent]
Id = enemyHealthPercent
Label = Enemy health
Group = Balance
Description = Percentage above or below the reference difficulty: 0% matches it, negative reduces it, positive increases it. Apply, then load a save.
Type = percent
Minimum = -90
Maximum = 400
Step = 1
Decimals = 1
Default = -16.666666666666675
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyHealthPercent

[Setting.enemyDamagePercent]
Id = enemyDamagePercent
Label = Enemy damage
Group = Balance
Description = Percentage above or below the reference difficulty: 0% matches it, negative reduces it, positive increases it. Apply, then load a save.
Type = percent
Minimum = -90
Maximum = 400
Step = 1
Decimals = 1
Default = -37.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyDamagePercent

[Setting.staminaCostPercent]
Id = staminaCostPercent
Label = Combat stamina cost
Group = Balance
Description = Percentage above or below the reference difficulty: 0% matches it, negative reduces it, positive increases it. Apply, then load a save.
Type = percent
Minimum = -90
Maximum = 400
Step = 1
Decimals = 1
Default = -42.857142857142861
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaCostPercent

[Setting.enemyAggressionPercent]
Id = enemyAggressionPercent
Label = Enemy attack pressure
Group = Balance
Description = Percentage above or below the reference difficulty: 0% matches it, negative reduces it, positive increases it. Attack pressure scales cooldowns, not animations. Apply, then load a save.
Type = percent
Minimum = -90
Maximum = 400
Step = 1
Decimals = 1
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyAggressionPercent

[Setting.debugLogging]
Id = debugLogging
Label = Debug logging
Group = Diagnostics
Description = Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging

[Category.Balance]
VisibleWhen = enabled
VisibleValues = 1
