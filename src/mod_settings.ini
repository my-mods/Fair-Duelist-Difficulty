[Setting.attackDuringBlock]
Id = attackDuringBlock
Label = Attacks while another enemy blocks
Group = Balance
Description = Allow an enemy to start an attack while another enemy is reacting to a block. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
