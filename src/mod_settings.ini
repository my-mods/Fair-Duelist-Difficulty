[Mod]
Id = oOCamilleOo_FairDuelist
Name = Fair Duelist - Customizable Difficulty
Author = oOCamilleOo
Version = 1.1.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Absolute difficulty balance. Choosing a difficulty in either menu replaces custom values. Apply, then load a save.

[Setting.enabled]
Id = enabled
Label = Override difficulty balance
Group = General
Description = Enable editable balance values. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.difficultyPreset]
Id = difficultyPreset
Label = Balance preset
Group = Balance
Description = Warning: choosing Story, Fair, Challenging or Duelist replaces all custom balance values below. Adjust a value to use Custom. Restore discards unapplied changes. Apply, then load a save.
Type = picker
PresetValues = 0|1|2|3|4
PresetLabels = Story|Fair|Challenging|Duelist|Custom
CustomValue = 4
PresetTargets = enemyHealthPercent|enemyDamagePercent|staminaCostPercent|attackDelayPercent|lowHealthAttackDelayPercent|rangedAttackDelayPercent|attackDuringBlock
PresetMatrix = 50,40,50,200,200,200,0|100,100,100,140,120,140,0|100,130,150,120,100,120,1|90,160,175,100,60,100,1|-
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = difficultyPreset

[Setting.enemyHealthPercent]
Id = enemyHealthPercent
Label = Enemy health
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 500
Step = 1
Decimals = 1
Default = 90
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyHealthPercent

[Setting.enemyDamagePercent]
Id = enemyDamagePercent
Label = Enemy damage
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 800
Step = 1
Decimals = 1
Default = 160
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyDamagePercent

[Setting.staminaCostPercent]
Id = staminaCostPercent
Label = Combat stamina cost
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 875
Step = 1
Decimals = 1
Default = 175
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaCostPercent

[Setting.attackDelayPercent]
Id = attackDelayPercent
Label = Enemy attack delay
Group = Balance
Description = Absolute attack-delay multiplier: 100% is the unscaled delay; lower values allow more frequent attacks. Does not change animation speed. Apply, then load a save.
Type = percent
Minimum = 0
Maximum = 2000
Step = 1
Decimals = 1
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = attackDelayPercent

