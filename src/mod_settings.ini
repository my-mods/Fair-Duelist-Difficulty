[Mod]
Id = oOCamilleOo_FairDuelist
Name = Fair Duelist - Customizable Difficulty
Author = oOCamilleOo
Version = 1.1.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Change settings here. Apply, then fully restart the game.

[Setting.enabled]
Id = enabled
Label = Runtime difficulty overrides
Group = General
Description = The packaged Fair Duelist preset remains installed when this is Off. Apply, then fully restart the game.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.referenceDifficulty]
Id = referenceDifficulty
Label = Reference difficulty
Group = Balance
Description = Calculation baseline for every multiplier; select Fair Duelist for RPG and Action Difficulty in the game. Apply, then fully restart the game.
Type = picker
PresetValues = 0|1|2|3
PresetLabels = Story|Fair|Challenging|Duelist
Default = 3
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = referenceDifficulty

[Setting.enemyHealthMultiplier]
Id = enemyHealthMultiplier
Label = Enemy health
Group = Balance
Description = Multiplier relative to the chosen reference. Attack pressure scales cooldowns, not animations. Apply, then fully restart the game.
Type = slider
Minimum = 0.1
Maximum = 5
Step = 0.01
Decimals = 2
Default = 0.8333333333333333
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyHealthMultiplier

[Setting.enemyDamageMultiplier]
Id = enemyDamageMultiplier
Label = Enemy damage
Group = Balance
Description = Multiplier relative to the chosen reference. Attack pressure scales cooldowns, not animations. Apply, then fully restart the game.
Type = slider
Minimum = 0.1
Maximum = 5
Step = 0.01
Decimals = 2
Default = 0.625
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyDamageMultiplier

[Setting.staminaCostMultiplier]
Id = staminaCostMultiplier
Label = Combat stamina cost
Group = Balance
Description = Multiplier relative to the chosen reference. Attack pressure scales cooldowns, not animations. Apply, then fully restart the game.
Type = slider
Minimum = 0.1
Maximum = 5
Step = 0.01
Decimals = 2
Default = 0.5714285714285714
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaCostMultiplier

[Setting.enemyAggressionMultiplier]
Id = enemyAggressionMultiplier
Label = Enemy attack pressure
Group = Balance
Description = Multiplier relative to the chosen reference. Attack pressure scales cooldowns, not animations. Apply, then fully restart the game.
Type = slider
Minimum = 0.1
Maximum = 5
Step = 0.01
Decimals = 2
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyAggressionMultiplier

[Setting.debugLogging]
Id = debugLogging
Label = Debug logging
Group = Diagnostics
Description = Apply, then fully restart the game.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging

[Category.Balance]
VisibleWhen = enabled
VisibleValues = 1
